# All the words and images on the home page live here.
# Edit the text between the quotes, save, and GitHub Pages rebuilds the site
# in a minute or two. The layout is in index.html and doesn't need touching.
#
# Images go in assets/img/. Refer to them by file name only.

booking:
  # Your Cal.com link: the part after cal.com/, e.g. "cimelium/intro-call".
  # Once it's filled in, both "Book a call" buttons open the booking calendar
  # in a pop-up. Leave it empty and they use the button links below instead.
  cal_link: "https://cal.com/cimelium/30min"

hero:
  title: "Art world software that works"
  title_highlight: "your way"   # shown in brick red at the end of the heading
  subtitle: "An open platforma built for the art world, that adapts to how you work — not the other way around."
  button:
    label: "Book a call"
    link: "#book"
  image: "hero-art.webp"
  image_alt: "Painting of an abstract red and black figure"

business_model:
  title: "Software that works your way"
  lead: "Cimelium brings your art business's records, workflows and AI tools together in one adaptable system. Start with what you need, connect the tools you already use, and extend your software as your business evolves."
  body: "Cimelium's AI assistants work with your business information and workflows to help your team research opportunities, manage routine work and build stronger collector relationships. Sensitive information remains under your control, and communications are prepared for your team to review and approve."

roles:
  label: "Built around the way the art world works"
  # Each role becomes one stacking card. The big counter (01, 02 …) is
  # numbered automatically, so adding or removing a role just works.
  # image_focus picks which part of the painting stays in view (CSS object-position).
  items:
    - name: "Gallerists"
      text: "Turn every enquiry into a relationship. Match collectors to works, draft follow-ups and keep every artwork’s story consistent across channels."
      image: "art-1.webp"
      image_focus: "center 40%"
    - name: "Art Advisors"
      text: "Research faster, advise better. Surface comparable works, trace provenance and brief each client in your own voice."
      image: "art-2.webp"
      image_focus: "center 30%"
    - name: "Auctioneers"
      text: "From consignment to catalogue. Write lot essays, segment bidders and personalise pre-sale outreach at scale."
      image: "art-3.webp"
      image_focus: "center 35%"
    - name: "Registrars"
      text: "Open up the archive. Enrich records, draft interpretive text and make the collection searchable for every audience."
      image: "art-4.webp"
      image_focus: "center 50%"
    - name: "Artists"
      text: "Tell the story behind every work. Keep a living archive, draft statements and share new work with the collectors most likely to love it."
      image: "art-5.webp"
      image_focus: "center 40%"
    - name: "Curators"
      text: "Research, write and assemble exhibitions faster. Pull together loans, wall labels and catalogue essays from one place."
      image: "art-6.webp"
      image_focus: "center 45%"

one_place:
  title: "Your business. Your way of working. Your software."
  subtitle: "Start with what you need. Adapt your workflows, add extensions, or build new functionality. Cimelium grows with your business — without forcing you into a fixed product or making you build everything from scratch."
  items:
    - title: "Start with what you need"
      text: "Use the capabilities that fit your business today. Add more as your needs change."
    - title: "Make it work your way"
      text: "Adapt workflows and functionality to the way your business actually operates."
    - title: "Extend without starting over"
      text: "Add capabilities through an ecosystem of extensions rather than replacing your system."
    - title: "Build what is missing"
      text: "AI coding agents help create and maintain functionality tailored to your needs."

your_data:
  title: "Your data, your technology, your freedom"
  intro: "Your business data should remain under your control. Cimelium is designed for local and private deployment, with cloud services where you choose to use them. Your records and your software remain yours — not something you lose if you change providers."
  points:
    - title: "Your records stay with you."
      text: "Own your code and business records. Keep access to what you have built, even if you stop working with Cimelium."
    - title: "Routine work, done reliably."
      text: "Automate repeatable processes through defined workflows, with less manual administration and fewer things falling through the cracks."
    - title: "Nothing goes out without you."
      text: "AI prepares work for review where judgement matters. Your team decides what gets sent, shared or acted upon."

pilot:
  title: "Join our pilot partner program"
  body: "Help shape a better way to run an art business with AI. Work with us to adapt Cimelium to your workflows, reduce routine administration and give your team more time for the relationships that matter. Keep control of your data and your software as your business evolves."
  closing: "Intrigued? Join other pioneers building with us today."
  button:
    label: "Book a call"
    link: "#"   # swap in the booking link (Calendly etc.) when there is one
  image: "drapery.webp"
  image_alt: "Sepia drawing of drapery folds"

footer:
  email: "hello@cimelium.com"
