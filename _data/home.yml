# All the words and images on the home page live here.
# Edit the text between the quotes, save, and GitHub Pages rebuilds the site
# in a minute or two. The layout is in index.html and doesn't need touching.
#
# Images go in assets/img/. Refer to them by file name only.

booking:
  # Your Cal.com link: the part after cal.com/, e.g. "cimelium/intro-call".
  # Once it's filled in, both "Book a call" buttons open the booking calendar
  # in a pop-up. Leave it empty and they use the button links below instead.
  cal_link: "https://cal.com/cimelium/30min"

hero:
  title: "Art world software that works"
  title_highlight: "your way"   # shown in brick red at the end of the heading
  subtitle: "An open platform built for the art world, that adapts to how you work — not the other way around."
  button:
    label: "Book a call"
    link: "#book"
  image: "hero-art.webp"
  image_alt: "Painting of an abstract red and black figure"

business_model:
  title: "Put AI to work across your business"
  lead: "Cimelium uses AI to help you research opportunities, prepare communications and manage routine tasks using the information and records you already rely on."
  body: "Unlike a general-purpose AI assistant, Cimelium turns AI capabilities into repeatable business processes, with your private records kept under your control and your team in charge of decisions and actions."

roles:
  label: "Built around the way the art world works"
  # Each role becomes one stacking card. The big counter (01, 02 …) is
  # numbered automatically, so adding or removing a role just works.
  # image_focus picks which part of the painting stays in view (CSS object-position).
  items:
    - name: "Gallerists"
      text: "Turn every enquiry into a relationship. Match collectors to works, draft follow-ups and keep every artwork’s story consistent across channels."
      image: "art-1.webp"
      image_focus: "center 40%"
    - name: "Art Advisors"
      text: "Research faster, advise better. Surface comparable works, trace provenance and brief each client in your own voice."
      image: "art-2.webp"
      image_focus: "center 30%"
    - name: "Auctioneers"
      text: "From consignment to catalogue. Write lot essays, segment bidders and personalise pre-sale outreach at scale."
      image: "art-3.webp"
      image_focus: "center 35%"
    - name: "Registrars"
      text: "Open up the archive. Enrich records, draft interpretive text and make the collection searchable for every audience."
      image: "art-4.webp"
      image_focus: "center 50%"
    - name: "Artists"
      text: "Tell the story behind every work. Keep a living archive, draft statements and share new work with the collectors most likely to love it."
      image: "art-5.webp"
      image_focus: "center 40%"
    - name: "Curators"
      text: "Research, write and assemble exhibitions faster. Pull together loans, wall labels and catalogue essays from one place."
      image: "art-6.webp"
      image_focus: "center 45%"

one_place:
  title: "Software that evolves with you."
  subtitle: "Start with what you need. Adapt your workflows, add extensions, or build new functionality. Cimelium grows with you."
  items:
    - title: "Compose"
      text: "Start small, with building blocks that mirror your business model and data."
    - title: "Tailor"
      text: "Shape the system around how you operate so everything earns its place."
    - title: "Extend"
      text: "Add workflows for new use cases through an open ecosystem of extensions."
    - title: "Create"
      text: "Use our agents to create new bespoke workflows tailored to your needs."

your_data:
  title: "Your data, your technology, your freedom"
  intro: "Your business is too important to be locked into any software vendor. Cimelium is designed to put you in control of your data, your software and where it runs — so you can build on what you have, without being locked into a fixed product."
  points:
    - title: "Your data. Your control."
      text: "Your information, your working methods and the relationships you build should remain yours to control."
    - title: "Your software. Your ownership."
      text: "Own the solution and retain the freedom to adapt, extend and adjust what you build."
    - title: "Your infrastructure. Your choice."
      text: "Run locally, in a private environment or through cloud services, according to your needs."

pilot:
  title: "Join our pilot partner program"
  body: "We're working with early partners to develop and refine Cimelium around real art-market workflows. Join us to help shape what comes next."
  closing: "Intrigued? Join other pioneers building with us today."
  button:
    label: "Book a call"
    link: "#"   # swap in the booking link (Calendly etc.) when there is one
  image: "drapery.webp"
  image_alt: "Sepia drawing of drapery folds"

footer:
  email: "hello@cimelium.com"
